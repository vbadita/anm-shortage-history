# One-off full parse of every stored PDF into /data/anm.sqlite: first build of the
# database, and after a PARSER_VERSION bump (~10 s per version; the daily sync only
# parses what it downloads). Re-run: kubectl -n anm delete job anm-parse && kubectl apply -f this file.
apiVersion: batch/v1
kind: Job
metadata:
  name: anm-parse
  namespace: anm
  labels:
    app.kubernetes.io/name: anm-collector
    app.kubernetes.io/component: parse
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anm-collector
        app.kubernetes.io/component: parse
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: anm-collector:3835642
          imagePullPolicy: IfNotPresent
          args: ["parse"]
          envFrom:
            - configMapRef:
                name: anm-config
          resources:
            requests: {cpu: 25m, memory: 128Mi, ephemeral-storage: 50Mi}
            limits: {memory: 512Mi, ephemeral-storage: 100Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anm-data
