# /etc/nginx/conf.d/apps.badita.com.conf  (nginx 1.26, included inside http {})
# Browser --TLS--> Cloudflare edge --TLS (Full strict, Origin CA cert)--> this nginx :443
#   /istoric-lipsa-medicament-vaccin/*  -> anm-web search page (NodePort 30380)
#   /anm/grafana/*                      -> Grafana  (NodePort 30300 on the kind node's Docker bridge, not public)
#   /anm/*                              -> 301 to /istoric-lipsa-medicament-vaccin/* (old links keep working)
#   /                                   -> directory of the apps (deploy/portal/, /srv/apps-portal)
#   apps.badita.com.d/*.conf            -> other apps' locations (antonim, ...)
#   other                               -> 404  (nginx picks the LONGEST matching prefix, not the first)

server_tokens off;                       # no nginx version in headers / error pages

upstream grafana {
    server 172.18.0.2:30300;             # kind node IP on the Docker bridge; changes if the cluster is recreated
    keepalive 8;
}

upstream anm_web {
    server 172.18.0.2:30380;
    keepalive 8;
}

# WebSocket support (Grafana Live): forward Upgrade, keep "Connection" empty otherwise
# so upstream keepalive still works.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# Catch-all for TLS connections that do not ask for apps.badita.com (IP scanners, other
# names): refuse the handshake, so neither the certificate nor the site is revealed.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name apps.badita.com;

    # Cloudflare Origin CA certificate: trusted only by Cloudflare, which is the only client
    # allowed to reach this port (firewalld ipset). Valid until 2041.
    ssl_certificate     /etc/nginx/tls/apps.badita.com.pem;
    ssl_certificate_key /etc/nginx/tls/apps.badita.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No includeSubDomains/preload: other badita.com subdomains are not ours to commit to HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/apps.badita.com.access.log;
    error_log  /var/log/nginx/apps.badita.com.error.log warn;

    location = /istoric-lipsa-medicament-vaccin { return 301 /istoric-lipsa-medicament-vaccin/; }

    location /istoric-lipsa-medicament-vaccin/ {
        proxy_pass http://anm_web;       # no URI part: the path is passed through unchanged
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # visitor IP, restored by realip
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Old public path (2026-10-20 .. 2026-10-21). Permanent redirect; the query string is
    # appended automatically by rewrite, so /anm/?q=x -> /istoric-lipsa-medicament-vaccin/?q=x.
    location = /anm { return 301 /istoric-lipsa-medicament-vaccin/; }
    location /anm/ {
        rewrite ^/anm/(.*)$ /istoric-lipsa-medicament-vaccin/$1 permanent;
    }

    location = /anm/grafana { return 301 /anm/grafana/; }

    location /anm/grafana/ {
        proxy_pass http://grafana;       # Grafana serves from /anm/grafana/ itself (serve_from_sub_path)
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;   # visitor IP, restored by realip below
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Crawlers: everything allowed; the sitemap lists the search home + every product page.
    # (Cloudflare's managed robots.txt adds its "content signals" comments in front of this.)
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *
Allow: /

Sitemap: https://apps.badita.com/istoric-lipsa-medicament-vaccin/sitemap.xml
Sitemap: https://apps.badita.com/legi-adoptate/sitemap.xml
";
    }

    # Directory of the apps on this host: two static files, no JavaScript, so the
    # CSP can forbid every script. A location with add_header drops the server's
    # add_header lines, so HSTS and Referrer-Policy are repeated here.
    location = / {
        root /srv/apps-portal;
        try_files /index.html =404;
        charset utf-8;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Cache-Control             "no-cache, no-transform" always;
        add_header Content-Security-Policy   "default-src 'none'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /portal.css {
        root /srv/apps-portal;
        try_files /portal.css =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Cache-Control             "public, max-age=3600" always;
    }

    # Other apps on this host ship their own locations (e.g. antonim from github.com/vbadita/antonim).
    include /etc/nginx/apps.badita.com.d/*.conf;

    location / { return 404; }
}
